function ConformPwd(){
	var hash1 = allWebSafeInputCtl_1.GetPasswordHash();
	var hash2 = allWebSafeInputCtl_2.GetPasswordHash();
	var varlog ;
	varlog = "allWebSafeInputCtl_1 hash:\n" + hash1;
	varlog += "\nallWebSafeInputCtl_2 hash:\n" + hash2 + "\n";
	
	if(hash1 == hash2){
		varlog += "\nallWebSafeInputCtl_1 == allWebSafeInputCtl_2\n";
	}else{
		varlog += "\nallWebSafeInputCtl_1 != allWebSafeInputCtl_2\n";
	}
	WriteLog(varlog);
}

function WriteLog(vlog){
	var varlog = document.getElementById("log");
	varlog.value = vlog;
}

///--------event-----------
function OnCreated(strID){
	console.log("OnCreated" + strID);
}
var g_hash1;
var g_hash2;
function OnPwdChange(strID){
	var pwd = document.getElementById(strID);
	var varlog = "OnPwdChange: " + strID + "\n";
	var inputctrl = awp_getPluginById(strID);
	if(inputctrl){
		var nCount = inputctrl.GetPasswordLength();
		var varValue = "";
		for(var i = 0;i < nCount;i++){
			varValue += ' ';
		}
		pwd.value = varValue;
	}
	
	if(strID == "allWebSafeInputCtl_1"){
		g_hash1 = inputctrl.GetPasswordHash();
	}else if(strID == "allWebSafeInputCtl_2"){
		g_hash2 = inputctrl.GetPasswordHash();
	}
	
	var varStrength = inputctrl.GetPasswordStrength();
	var varElemID = strID + "_Strength";
	var varStrengthElem = document.getElementById(varElemID);	
	if(varStrength == 0){
		varStrengthElem.value = "低";
	}else if(varStrength == 1){
		varStrengthElem.value = "中";
	}else if(varStrength == 2){
		varStrengthElem.value = "高";
	}else if(varStrength == 3){
		varStrengthElem.value = "较高";
	}
	
	varlog += "allWebSafeInputCtl_1 hash:\n" + g_hash1;
	varlog += "\nallWebSafeInputCtl_2 hash:\n" + g_hash2 + "\n";
	
	if(g_hash1 == g_hash2){
		varlog += "\nallWebSafeInputCtl_1 == allWebSafeInputCtl_2\n";
	}else{
		varlog += "\nallWebSafeInputCtl_1 != allWebSafeInputCtl_2\n";
	}
	WriteLog(varlog);
	
}
